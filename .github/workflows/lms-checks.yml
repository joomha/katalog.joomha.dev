name: LMS checks

on:
  push:
    branches:
      - agent/05-lms-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Schema, types, tests and lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joomha_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --schema=prisma

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Lint
        run: pnpm run lint
